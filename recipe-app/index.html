<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <title>Recipe Glass</title>
    <style>
      :root {
        --text: #232323;
        --text-dim: #7b7b7b;
        --bg: #ffffff;
        --surface: #eeeeee;
        --input-bg: rgba(35, 35, 35, 0.08);
        --accent: #fef991;
        --danger: #c0392b;
        --radius: 12px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #ffffff;
          --text-dim: #8a8a8a;
          --bg: #111111;
          --surface: #1a1a1a;
          --input-bg: rgba(255, 255, 255, 0.08);
          --danger: #ff6b5b;
        }
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Noto Sans TC",
          "Source Han Sans TC", system-ui, sans-serif;
        letter-spacing: -0.01em;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      #app { padding: 20px 20px 48px; max-width: 720px; margin: 0 auto; }
      h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
      h2 { font-size: 18px; font-weight: 500; letter-spacing: -0.01em; margin: 32px 0 12px; }
      .row { display: flex; gap: 8px; align-items: center; }
      .between { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
      .dim { color: var(--text-dim); }
      .caption { font-size: 13px; color: var(--text-dim); }
      .label {
        font-size: 11px; font-weight: 500; letter-spacing: 0.04em;
        text-transform: uppercase; color: var(--text-dim);
      }
      button {
        font: inherit; border: 0; border-radius: var(--radius); padding: 12px 16px;
        background: var(--input-bg); color: var(--text); cursor: pointer;
      }
      button.primary { background: var(--accent); color: #232323; font-weight: 600; }
      button.danger { background: transparent; color: var(--danger); padding: 8px 10px; }
      button.icon { padding: 8px 12px; min-width: 44px; }
      button:disabled { opacity: 0.5; cursor: default; }
      input, textarea {
        font: inherit; width: 100%; border: 0; border-radius: var(--radius);
        padding: 12px; background: var(--input-bg); color: var(--text);
      }
      textarea { resize: vertical; min-height: 72px; }
      .card {
        background: var(--surface); border-radius: var(--radius);
        padding: 16px; margin-bottom: 12px;
      }
      .card.tappable { cursor: pointer; }
      .stack { display: flex; flex-direction: column; gap: 12px; }
      .empty { text-align: center; color: var(--text-dim); padding: 48px 0; }
      .error {
        background: rgba(192, 57, 43, 0.12); color: var(--danger);
        border-radius: var(--radius); padding: 12px; margin: 12px 0;
      }
      .badge {
        font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase;
        color: var(--text-dim); border: 1px solid var(--input-bg);
        border-radius: 999px; padding: 2px 8px;
      }
      .grow { flex: 1; min-width: 0; }
      .sticky-actions {
        position: sticky; bottom: 0; background: var(--bg);
        padding: 12px 0; display: flex; gap: 8px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
