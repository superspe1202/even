<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Recipe Glass</title>
    <style>
      :root {
        --text: #232323;
        --text-dim: #6e6e6e;
        --bg: #f0f0f0;
        --surface: #ffffff;
        --input-bg: #e4e4e4;
        --hairline: #f0f0f0;
        --accent: #fef991;
        --danger: #c0392b;
        --radius: 14px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #ffffff;
          --text-dim: #9a9a9a;
          --bg: #111111;
          --surface: #1c1c1c;
          --input-bg: #2a2a2a;
          --hairline: #2a2a2a;
          --danger: #ff6b5b;
        }
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Noto Sans TC",
          "Source Han Sans TC", system-ui, sans-serif;
        letter-spacing: -0.01em;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }
      /*
       * 底部多留空間：Even App 的 WebView 底部可能有自己的列或 Home 指示條蓋住內容，
       * 頁面最下面的按鈕（例如 AI 搜尋最後一種做法）會被擋住、捲不到。
       */
      #app {
        padding: 20px 16px calc(140px + env(safe-area-inset-bottom, 0px));
        max-width: 720px; margin: 0 auto;
      }
      h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
      h2 { font-size: 15px; font-weight: 700; margin: 26px 2px 8px; }
      p { margin: 0; }
      .row { display: flex; gap: 8px; align-items: center; }
      .between { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
      .stack { display: flex; flex-direction: column; gap: 10px; }
      .grow { flex: 1; min-width: 0; }
      .block { display: block; }
      .caption { font-size: 14px; color: var(--text-dim); }
      .title-row { font-size: 17px; font-weight: 500; }
      .label {
        font-size: 12px; font-weight: 500; letter-spacing: 0.04em;
        text-transform: uppercase; color: var(--text-dim);
      }
      .struck { color: var(--text-dim); text-decoration: line-through; }
      .step-no { width: 22px; font-size: 14px; font-weight: 700; color: var(--text-dim); }
      .chev { color: var(--text-dim); display: flex; }

      button {
        font: inherit; border: 0; border-radius: var(--radius); padding: 13px 16px;
        background: var(--input-bg); color: var(--text); cursor: pointer;
      }
      button.primary { background: #232323; color: #ffffff; font-weight: 500; }
      button.primary.big { width: 100%; padding: 18px; font-size: 18px; }
      button.small { padding: 9px 14px; font-size: 14px; flex-shrink: 0; }
      button.ghost { background: transparent; color: var(--text-dim); padding: 9px 10px; }
      button.danger { background: transparent; color: var(--danger); }
      button.icon {
        padding: 0; width: 38px; height: 38px; display: inline-flex;
        align-items: center; justify-content: center; position: relative; flex-shrink: 0;
      }
      button:disabled { opacity: 0.45; cursor: default; }
      @media (prefers-color-scheme: dark) {
        button.primary { background: #ffffff; color: #111111; }
      }

      input, textarea, select {
        font: inherit; width: 100%; border: 0; border-radius: var(--radius);
        padding: 13px; background: var(--surface); color: var(--text);
      }
      input.mini { width: 78px; padding: 9px; background: var(--input-bg); text-align: center; }
      input.bare { background: transparent; padding: 6px 0; border-radius: 0; }
      input[type="checkbox"] {
        width: 22px; height: 22px; flex-shrink: 0; accent-color: #232323; padding: 0;
      }
      textarea { resize: vertical; min-height: 68px; line-height: 1.5; }
      select { appearance: none; padding-right: 32px; }

      .card {
        background: var(--surface); border-radius: var(--radius);
        padding: 14px 16px; margin-bottom: 8px;
      }
      .card.tappable { cursor: pointer; text-decoration: none; color: inherit; display: flex; }
      .card .row:last-child { border-bottom: 0 !important; }

      .chips { display: flex; gap: 7px; flex-wrap: wrap; }
      .chip {
        padding: 8px 14px; font-size: 14px; border-radius: 999px;
        background: var(--surface); color: var(--text-dim);
      }
      .chip.on { background: #232323; color: #ffffff; }
      @media (prefers-color-scheme: dark) { .chip.on { background: #ffffff; color: #111111; } }

      .badge {
        font-size: 11px; font-weight: 500; letter-spacing: 0.03em;
        padding: 3px 9px; border-radius: 999px; flex-shrink: 0;
        background: var(--input-bg); color: var(--text-dim);
      }
      .badge.accent { background: var(--accent); color: #232323; }
      .dot {
        position: absolute; top: 0; right: 0; min-width: 17px; height: 17px;
        border-radius: 9px; background: var(--danger); color: #ffffff;
        font-size: 11px; line-height: 17px; text-align: center; padding: 0 4px;
      }

      .empty { text-align: center; color: var(--text-dim); padding: 44px 0; line-height: 1.8; }
      .error {
        background: rgba(192, 57, 43, 0.12); color: var(--danger);
        border-radius: var(--radius); padding: 12px; margin-bottom: 14px;
      }
      /* 提示浮在上方，不佔版面，出現、消失時內容不會跳。 */
      #toast {
        position: fixed; left: 16px; right: 16px; top: calc(12px + env(safe-area-inset-top, 0px));
        max-width: 688px; margin: 0 auto; z-index: 20;
        background: #232323; color: #ffffff; border-radius: var(--radius);
        padding: 12px 14px; font-size: 15px; text-align: center;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.2);
        opacity: 0; transform: translateY(-8px); pointer-events: none;
        transition: opacity 0.2s, transform 0.2s;
      }
      #toast.show { opacity: 1; transform: none; }
      @media (prefers-color-scheme: dark) { #toast { background: #333333; } }

      /* 食譜庫：新增食譜的入口一排排開。 */
      .tiles { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
      button.tile {
        display: flex; flex-direction: column; align-items: center; gap: 6px;
        padding: 14px 4px 12px; background: var(--surface); font-size: 14px; font-weight: 500;
      }
      button.tile svg { color: var(--text); }

      /* 詳情頁 */
      .chips.meta { margin: -8px 0 16px; }
      .chips.meta .chip { padding: 5px 12px; font-size: 13px; cursor: default; }
      .now-card {
        display: flex; align-items: center; gap: 12px;
        background: var(--accent); color: #232323; border-radius: var(--radius); padding: 14px 16px;
      }
      .now-title { font-weight: 700; font-size: 17px; }
      .now-card button { background: #232323; color: #ffffff; }

      button.added {
        display: inline-flex; align-items: center; gap: 4px;
        background: transparent; color: var(--text-dim);
      }
      input.mini.short { width: 60px; }

      /* 眼鏡同步：時間到橫幅黏在最上面，捲到哪都看得到。 */
      #live { position: sticky; top: 8px; z-index: 5; }
      .alarm {
        background: var(--accent); color: #232323; border-radius: var(--radius);
        padding: 14px 16px; margin-bottom: 14px; align-items: center; gap: 12px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
      }
      .alarm .caption { color: #4a4a2a; }
      .alarm-title { font-size: 20px; font-weight: 700; }
      .alarm-step { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .alarm button { background: #232323; color: #ffffff; }

      .card.live { margin-bottom: 14px; }
      .live-row {
        display: flex; align-items: center; gap: 8px; padding: 8px 0;
        color: inherit; text-decoration: none;
      }
      .live-row + .live-row { border-top: 1px solid var(--hairline); }
      .tappable { cursor: pointer; }
      .countdown { font-variant-numeric: tabular-nums; font-weight: 700; }
      button.switch { width: 100%; text-align: left; }

      .step-row {
        display: flex; align-items: flex-start; gap: 12px; padding: 12px 8px;
        margin: 0 -8px; border-bottom: 1px solid var(--hairline);
        color: inherit; text-decoration: none; border-radius: 10px;
      }
      .step-row:last-child { border-bottom: 0; }
      .step-row.current { background: var(--accent); color: #232323; border-bottom-color: transparent; }
      .step-row.current .caption, .step-row.current .step-no { color: #4a4a2a; }
      .here { font-size: 12px; font-weight: 700; margin-top: 6px; }
      .step-row .badge { display: inline-block; font-size: 12px; }
      button.timer-btn { padding: 6px 10px; font-size: 13px; border-radius: 999px; }
      .step-row.current button.timer-btn { background: #232323; color: #ffffff; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
